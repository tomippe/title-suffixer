<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      min-width: 300px;
      background: #f5f5f5;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #555;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    
    input[type="text"]:focus {
      outline: none;
      border-color: #4285f4;
    }
    
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
    }
    
    .preview {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-top: 16px;
    }
    
    .preview-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    
    .preview-text {
      font-size: 14px;
      color: #333;
      word-break: break-all;
    }
    
    button {
      background: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #3367d6;
    }
    
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #34a853;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .status.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="suffix">サフィックス</label>
    <input type="text" id="suffix" placeholder="例: 仕事用">
    <div class="hint">自動的に [文字列] の形式でタイトル末尾に追加されます</div>
  </div>
  
  <div class="preview">
    <div class="preview-label">プレビュー</div>
    <div class="preview-text" id="preview">Google検索 [とみっぺ]</div>
  </div>
  
  <div style="margin-top: 20px;">
    <button id="save">保存</button>
    <div class="status" id="status">✓ 保存しました</div>
  </div>
  
  <script src="options.js"></script>
</body>
</html>
